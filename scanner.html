<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{font-family:Arial,sans-serif;margin:0;padding:18px;background:#f1f5f9;color:#0f172a}.card{max-width:520px;margin:auto;background:white;padding:18px;border-radius:16px;box-shadow:0 8px 28px #0f172a18}h2{margin-top:0}#reader{width:100%;min-height:250px}p{line-height:1.5}.btn{border:0;border-radius:8px;background:#2563eb;color:white;padding:11px 16px;font-size:16px;margin:5px 4px 5px 0}.muted{color:#475569;font-size:14px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}</style></head>
<body><main class="card"><h2>📷 POS Barcode Scanner</h2><p id="status">Camera চালু হচ্ছে… Chrome-এ Camera permission চাইলে Allow দিন।</p><div id="reader"></div><p class="muted">Scan হলে Barcode মূল POS পেজে পাঠানো হবে। Camera কাজ না করলে নিচে Barcode লিখে Send চাপুন।</p><input id="manual" placeholder="Barcode নম্বর লিখুন"><button class="btn" id="send">Send to POS</button><button class="btn" id="stop" style="background:#475569">Camera বন্ধ</button></main>
<script>
let scanner=null, sent=false;
function sendCode(code){code=String(code||'').trim();if(!code)return; if(!window.opener||window.opener.closed){document.getElementById('status').textContent='POS window পাওয়া যায়নি। POS থেকে Camera Scan বাটনে ক্লিক করে এই পেজ খুলুন।';return;} sent=true;window.opener.postMessage({type:'POS_BARCODE_SCANNED',barcode:code},'*');document.getElementById('status').textContent='Barcode POS-এ পাঠানো হয়েছে: '+code;try{if(scanner)scanner.stop().catch(()=>{});}catch(e){}setTimeout(()=>window.close(),700);}
document.getElementById('send').onclick=()=>sendCode(document.getElementById('manual').value);
document.getElementById('manual').addEventListener('keydown',e=>{if(e.key==='Enter')sendCode(e.target.value)});
document.getElementById('stop').onclick=()=>{if(scanner)scanner.stop().catch(()=>{});document.getElementById('status').textContent='Camera বন্ধ করা হয়েছে।'};
(async function(){if(!window.isSecureContext){document.getElementById('status').textContent='HTTPS প্রয়োজন। এই scanner page HTTPS hosting-এ চালু করুন।';return;}if(!window.Html5Qrcode){document.getElementById('status').textContent='Scanner library load হয়নি; ইন্টারনেট সংযোগ পরীক্ষা করুন।';return;}try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},decoded=>sendCode(decoded),()=>{});document.getElementById('status').textContent='বারকোড ক্যামেরার সামনে ধরুন।';}catch(e){document.getElementById('status').textContent='Camera চালু হয়নি: '+(e.message||e)+'। Permission Allow করুন অথবা Barcode নম্বর লিখে Send চাপুন।';}})();
</script></body></html>
